<svg width="280" height="60" viewBox="0 0 280 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- K Logo -->
  <g>
    <!-- Left vertical bar -->
    <rect x="8" y="8" width="10" height="44" fill="#1a1f3a" rx="2"/>
    <!-- Top diagonal -->
    <polygon points="28,8 48,8 28,24" fill="#0f1729"/>
    <!-- Bottom diagonal (arrow) -->
    <polygon points="28,36 60,8 60,20 28,48" fill="#6366f1"/>
  </g>

  <!-- Kickoff Text -->
  <text x="78" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#ffffff">
    Kickoff
  </text>

  <!-- Dot accent (small circle) -->
  <circle cx="255" cy="28" r="4" fill="#6366f1"/>
</svg>
